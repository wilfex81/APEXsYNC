version: 2

models:
  - name: stg_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null

  - name: stg_cashflow
    columns:
      - name: cashflow_event_id
        tests:
          - unique
          - not_null

  - name: mart_monthly_cashflow
    columns:
      - name: month
        tests:
          - not_null
  - name: mart_profitability_flags
    columns:
      - name: category
        tests:
          - not_null