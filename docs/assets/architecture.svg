<svg width="680" height="784" viewBox="0 0 680 784" xmlns="http://www.w3.org/2000/svg" role="img">
<title>APEXsYNC architecture diagram</title>
<desc>Data flows from a raw synthetic feed through Django core models (Bronze), dbt staging (Silver) and marts (Gold), then fans out to the tax engine, analytics engine, and normalization module, which converge into a REST API serving client consumers. Ingestion and transformation are orchestrated by Airflow.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="165" y="20" width="350" height="420" rx="16" fill="none" stroke="#5F5E5A" stroke-opacity="0.4" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Orchestrated by Airflow · daily DAG</text>

<g>
<rect x="190" y="40" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Raw synthetic feed</text>
<text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">CFDI/CFE-style JSON</text>
</g>
<line x1="340" y1="84" x2="340" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="144" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Django core models</text>
<text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Bronze layer, unvalidated</text>
</g>
<line x1="340" y1="188" x2="340" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="248" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">dbt staging models</text>
<text x="340" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Silver: deduped, typed, tested</text>
</g>
<line x1="340" y1="304" x2="340" y2="364" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="364" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">dbt marts</text>
<text x="340" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Gold: cashflow, inventory, expense</text>
</g>

<path d="M340 420L340 440L135 440L135 480" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 420L340 480" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
