<text x="340" y="614" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">REST API (DRF)</text>
<text x="340" y="632" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">Serves tax, forecast, normalization</text>
</g>
<line x1="340" y1="640" x2="340" y2="700" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="700" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="722" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Client / consumers</text>
</g>
</svg>
