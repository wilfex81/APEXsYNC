<text x="135" y="520" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Versioned tax rules</text>
</g>
<g>
<rect x="255" y="480" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
